<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Agenda')}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container"
      th:with="hoje=${#temporals.createToday()},
               totalAgendadas=${#lists.size(consultas.?[status.name() == 'AGENDADA'])},
               totalRealizadas=${#lists.size(consultas.?[status.name() == 'REALIZADA'])},
               totalCanceladas=${#lists.size(consultas.?[status.name() == 'CANCELADA'])}">

    <div th:replace="~{layout :: mensagens}"></div>

    <header class="pagina-topo">
        <div>
            <span class="sobretitulo"
                  th:text="${data.isEqual(hoje)} ? 'Hoje'
                           : (${data.isEqual(hoje.plusDays(1))} ? 'Amanhã'
                           : (${data.isEqual(hoje.minusDays(1))} ? 'Ontem' : 'Agenda do dia'))">Hoje</span>
            <h1 th:text="${#temporals.format(data, 'dd/MM/yyyy')}">00/00/0000</h1>
            <p class="pagina-subtitulo"
               th:text="${#lists.isEmpty(consultas)} ? 'Nenhuma consulta neste dia.'
                        : (${#lists.size(consultas)} == 1 ? '1 consulta neste dia.'
                        : ${#lists.size(consultas)} + ' consultas neste dia.')">Resumo</p>
        </div>

        <!-- GET simples: a data vai como query param -->
        <div class="navegacao-dia">
            <a th:href="@{/vet/agenda(data=${data.minusDays(1)})}"
               class="btn btn-outline-secondary" aria-label="Dia anterior" title="Dia anterior">‹</a>

            <form th:action="@{/vet/agenda}" method="get" class="d-flex gap-2 m-0">
                <label for="data" class="visually-hidden">Escolher dia</label>
                <input type="date" id="data" name="data" class="form-control"
                       th:value="${data}" data-enviar-ao-mudar>
                <noscript><button type="submit" class="btn btn-primary">Ver</button></noscript>
            </form>

            <a th:href="@{/vet/agenda(data=${data.plusDays(1)})}"
               class="btn btn-outline-secondary" aria-label="Próximo dia" title="Próximo dia">›</a>

            <a th:unless="${data.isEqual(hoje)}" th:href="@{/vet/agenda}"
               class="btn btn-primary">Hoje</a>
        </div>
    </header>

    <!-- ---------- Resumo do dia ---------- -->
    <div class="row g-3 mb-4" th:unless="${#lists.isEmpty(consultas)}">
        <div class="col-4">
            <div class="card kpi h-100 kpi-destaque">
                <div class="card-body">
                    <p class="kpi-rotulo">A atender</p>
                    <p class="kpi-valor mb-0" th:text="${totalAgendadas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card kpi h-100">
                <div class="card-body">
                    <p class="kpi-rotulo">Realizadas</p>
                    <p class="kpi-valor mb-0" th:text="${totalRealizadas}">0</p>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card kpi h-100">
                <div class="card-body">
                    <p class="kpi-rotulo">Canceladas</p>
                    <p class="kpi-valor mb-0" th:text="${totalCanceladas}">0</p>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(consultas)}" class="vazio">
        <span th:replace="~{layout :: icone-vazio}"></span>
        <p class="vazio-titulo">Agenda livre</p>
        <p class="vazio-texto">Nenhuma consulta marcada para este dia. Use as setas para ver outros dias.</p>
    </div>

    <div class="lista-consultas" th:unless="${#lists.isEmpty(consultas)}">
        <article class="agenda-item" th:each="c : ${consultas}"
                 th:classappend="'agenda-' + ${#strings.toLowerCase(c.status)}">

            <time class="agenda-hora" th:datetime="${c.data}"
                  th:text="${#temporals.format(c.data, 'HH:mm')}">00:00</time>

            <div class="agenda-corpo">
                <p class="agenda-pet" th:text="${c.petNome}">Pet</p>
                <p class="mb-0 small text-secondary">
                    <th:block th:replace="~{layout :: tipo(${c.tipo})}"></th:block>
                    <span th:if="${c.descricao}" th:text="'· ' + ${c.descricao}"></span>
                </p>
                <p class="observacoes" th:if="${c.observacoes}">
                    <span class="observacoes-rotulo">Suas observações</span>
                    <span th:text="${c.observacoes}">observações</span>
                </p>
            </div>

            <div class="agenda-lado">
                <span th:replace="~{layout :: status(${c.status})}"></span>

                <a th:if="${c.status.name() == 'AGENDADA'}"
                   th:href="@{/vet/atender/{id}(id=${c.id})}"
                   class="btn btn-sm btn-primary">Atender</a>
                <a th:if="${c.status.name() == 'REALIZADA'}"
                   th:href="@{/vet/atender/{id}(id=${c.id})}"
                   class="btn btn-sm btn-outline-secondary">Ver ficha</a>
            </div>
        </article>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
