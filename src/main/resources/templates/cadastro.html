<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Criar conta')}"></head>

<body>

<main class="auth">

    <aside th:replace="~{layout :: painel-marca(
            'Comece a cuidar melhor em poucos minutos.',
            'Crie sua conta como responsável pelo pet ou como veterinário da clínica.')}"></aside>

    <section class="auth-conteudo">
        <div class="auth-formulario">

            <h2 class="auth-titulo">Crie sua conta</h2>
            <p class="auth-subtitulo">Leva menos de um minuto.</p>

            <form th:action="@{/cadastro}" th:object="${form}" method="post">

                <!-- Erros que não pertencem a um campo: e-mail duplicado, por exemplo -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                    <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <!-- O perfil vem primeiro: é ele que decide quais campos aparecem -->
                <fieldset class="mb-4">
                    <legend class="form-label fs-6">Como você vai usar o YourPetHealth?</legend>

                    <div class="row g-2">
                        <div class="col-6">
                            <input type="radio" class="btn-check" id="perfilResponsavel"
                                   th:field="*{perfil}" value="RESPONSAVEL">
                            <label class="opcao-perfil" for="perfilResponsavel">
                                <span class="opcao-perfil-titulo">Responsável</span>
                                <span class="opcao-perfil-descricao">
                                    Cadastro meus pets e agendo consultas
                                </span>
                            </label>
                        </div>

                        <div class="col-6">
                            <input type="radio" class="btn-check" id="perfilVeterinario"
                                   th:field="*{perfil}" value="VETERINARIO">
                            <label class="opcao-perfil" for="perfilVeterinario">
                                <span class="opcao-perfil-titulo">Veterinário</span>
                                <span class="opcao-perfil-descricao">
                                    Atendo consultas e registro o histórico
                                </span>
                            </label>
                        </div>
                    </div>

                    <div class="campo-erro" th:if="${#fields.hasErrors('perfil')}"
                         th:errors="*{perfil}"></div>
                </fieldset>

                <div th:replace="~{layout :: campo('nome', 'Nome completo', 'text')}"></div>
                <div th:replace="~{layout :: campo('email', 'E-mail', 'email')}"></div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <div class="input-group">
                        <input type="password" id="senha" th:field="*{senha}"
                               class="form-control" autocomplete="new-password"
                               th:classappend="${#fields.hasErrors('senha')} ? 'is-invalid'">
                        <button type="button" class="btn btn-outline-secondary"
                                data-alternar-senha="senha"
                                aria-controls="senha" aria-pressed="false">Mostrar</button>
                    </div>
                    <div class="form-text">No mínimo 8 caracteres.</div>
                    <div class="campo-erro" th:if="${#fields.hasErrors('senha')}"
                         th:errors="*{senha}"></div>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}"
                           class="form-control" placeholder="11987654321"
                           autocomplete="tel"
                           th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'">
                    <div class="campo-erro" th:if="${#fields.hasErrors('telefone')}"
                         th:errors="*{telefone}"></div>
                </div>

                <!-- Exibido pelo app.js quando o perfil escolhido é VETERINARIO.
                     A obrigatoriedade do CRMV é verificada no controller. -->
                <div id="camposVeterinario" hidden>

                    <p class="auth-secao">Dados profissionais</p>

                    <div th:replace="~{layout :: campo('crmv', 'CRMV', 'text')}"></div>

                    <div class="mb-3">
                        <label for="especialidade" class="form-label">Especialidade</label>
                        <input type="text" id="especialidade" th:field="*{especialidade}"
                               class="form-control" placeholder="Clínica geral">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Criar conta</button>
            </form>

            <p class="auth-alternativa">
                Já tem conta?
                <a th:href="@{/login}">Entrar</a>
            </p>
        </div>
    </section>
</main>

<th:block th:replace="~{layout :: scripts}"></th:block>

</body>
</html>
